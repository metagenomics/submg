name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Example ${{ matrix.example }}
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix:
        include:
          - example: "01"
            config: 01_samples_reads_assembly_bins_mags.yaml
            flags: --submit-samples --submit-reads --submit-assembly --submit-bins --submit-mags
          - example: "02"
            config: 02_samples_reads_assembly_bins.yaml
            flags: --submit-samples --submit-reads --submit-assembly --submit-bins
          - example: "03"
            config: 03_samples_reads_assembly.yaml
            flags: --submit-samples --submit-reads --submit-assembly
          - example: "04"
            config: 04_reads_assembly_bins_mags.yaml
            flags: --submit-reads --submit-assembly --submit-bins --submit-mags
          - example: "05"
            config: 05_reads_assembly_bins.yaml
            flags: --submit-reads --submit-assembly --submit-bins
          - example: "06"
            config: 06_reads_assembly.yaml
            flags: --submit-reads --submit-assembly
          - example: "07"
            config: 07_assembly_bins_mags.yaml
            flags: --submit-assembly --submit-bins --submit-mags
          - example: "08"
            config: 08_assembly_bins.yaml
            flags: --submit-assembly --submit-bins
          - example: "09"
            config: 09_assembly.yaml
            flags: --submit-assembly
          - example: "10"
            config: 10_bins_mags.yaml
            flags: --submit-bins --submit-mags
          - example: "11"
            config: 11_bins.yaml
            flags: --submit-bins
          - example: "12"
            config: 12_mags.yaml
            flags: --submit-mags
          - example: "13"
            config: 13_samples.yaml
            flags: --submit-samples
          - example: "14"
            config: 14_reads.yaml
            flags: --submit-reads
          - example: "15"
            config: 15_samples_reads.yaml
            flags: --submit-samples --submit-reads

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install the package and workflow as well as package dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        python -m pip install .
    - name: Download webin-cli
      run: |
        submg-cli download-webin
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Submit example
      working-directory: examples
      env:
        ENA_USER: ${{ secrets.ENA_USER }}
        ENA_PASSWORD: ${{ secrets.ENA_PASSWORD }}
        CFG: ${{ matrix.config }}
        EXAMPLE: ${{ matrix.example }}
        SUBMIT_FLAGS: ${{ matrix.flags }}
      run: |
        RANDOM_STR=$(python -c 'import secrets, string; print("".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(5)))')
        sed -i "s/idx00/${RANDOM_STR}/g" "$CFG"
        read -r -a flags <<< "$SUBMIT_FLAGS"
        submg-cli submit \
          --config "$CFG" \
          --staging-dir "example${EXAMPLE}/staging" \
          --logging-dir "example${EXAMPLE}/logging" \
          "${flags[@]}"
